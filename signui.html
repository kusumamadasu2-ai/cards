<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./signui.css">
</head>
<body>
    <h1>Sign Up Form</h1>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" size="15" required>
        <p>Enter your Name</p>

        <br>
        <br>

        <label for="College">College</label>
        <input type="text" id="college" size="15" disabled>
        <p>Enter your College</p>
        
        <br>
        <br>

        <label for="primarymail">Primary Email: </label>
        <input type="email" id="primarymail" size="15" required>
        <p>Enter your Primary Mail</p>

        <img class="valid" src="https://cdn.vectorstock.com/i/1000v/44/96/check-tick-mark-on-wavy-edge-green-circle-sticker-vector-47744496.jpg" alt="">
        <img class="invalid" src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcRrNGHMZNeh7TPX1w9MpNuQjc9fVC47WeFW_24xHrq8JGeNp9l8" alt="">

        <br>
        <br>

        <label for="secondarymail">Secondary Email: </label>
        <input type="email" id="secondarymail" size="15">
        <p>Enter your Secondary Mail</p>

        <br>
        <br>

        <label for="password">Password: </label>
        <input type="password" id="password" size="15" required>
        <p>Enter your Password</p>
        <br>
        <br>


        <label>Gender: </label>
        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>
        
        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>
        
        <input type="radio" id="other" name="gender">
        <label for="other">Other</label>

        <br>
        <br>

        <label for="age">Age: </label>
        <input type="number" id="age" min="18" max="100" size="15" required>
        <p>Enter your Age</p>
        <br>
        <br>

        <label for="mod">MOD: </label>
        <input type="text" id="mod" value="online" readonly>
        <p>Online Mode is Available</p>

        <br>
        <br>

        <input type="submit">


    </form>
</body>
</html>
