<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<head>
<body>
    <title>Web Page</title>
    <link rel="stylesheet" href="index.css">

    <!-- Personal Information -->
    <div class="profile">

        <h1> Kusuma Madasu</h1>

        <h2>About Me</h2>

        <p class="about">
            Hello! My name is Kusuma. I have completed my MCA.
            I am interested in learning Java, HTML, CSS and SQL.
            My goal is to start my career in the IT industry.
        </p>

        <h1>My Skills</h1>

        <ul>
            <li>Java </li>
            <li>SQL</li>
            <li>HTML</li>
            <li>CSS</li>
        </ul>

    </div>

    <!-- Iframe -->
    <h2>My Iframe</h2>

    <div class="iframe-box">
        <iframe
            src="https://khitguntur.ac.in/"controls>
            <title>college</title>
        </iframe>
    </div>


    <!-- Registration Form -->
    <div id="registration">

        <h2>Student Registration Form</h2>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <br>
            <br>

            <label for="Email">Email:</label>
            <input type="email" name="email" placeholder="Enter your email">
            <br>
            <br>


            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter password">
            <br>
            <br>

        
            <label>Gender:</label>

             <label for="male">male</label>
        <input type="radio"id="male" name = "gender"/>

         <label for="female">female</label>
        <input type="radio"id="female" name = "gender"/>

         <label for="others">others</label>
        <input type="radio"id="others" name = "gender"/>

        <button type="submit"> submit</button>
            <br>
            <br>

            <!-- Course -->
            <label>Course:</label>

            <select name="course">
                <option value>Select Course</option>
                 <option value>Java Full Stack</option>
                 <option value>Python Full Stack</option>
                 <option value>Data Science</option>
                <option value>Web Development</option>
            </select>

            <br>
            <br>

            <!-- Skills -->
            <label>Skills:</label>

             <label for="Java">Java</label>
        <input type="checkbox"id="JAVA" name = "skill" value="JAVA"/>

        <label for="html">HTML</label>
        <input type="checkbox"id="HTML" name = "skill" value="HTML"/>

         <label for="CSS">CSS</label>
        <input type="checkbox"id="CSS" name = "skill" value="CSS"/>

        <button type="submit"> submit</button>

            <br><br>

            <!-- Date of Birth -->
            <label>Date of Birth:</label>
            <input type="date" name="dob">

            <br>
            <br>

            <!-- Address -->
            <label>Address:</label>
            <br>

            <textarea
                name="address"
                rows="5"
                cols="50"
                placeholder="Enter your address">
            </textarea>

            <br><br>

            <!-- Buttons -->
            <input type="submit" value="Submit" class="submit-btn">

            <input type="reset" value="Reset" class="reset-btn">

        </form>

    </div>

</body>
</html>
